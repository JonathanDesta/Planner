<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#183e39" />
    <meta
      name="description"
      content="Your campus day, with room for the real journey."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Day · Campus Planner</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to your day</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./"
          ><span class="brand-mark" aria-hidden="true">d.</span
          ><span
            >day<span class="brand-sub">A little room for life.</span></span
          ></a
        >
        <nav aria-label="Main navigation">
          <button data-view="today" aria-current="page">
            <span aria-hidden="true">◉</span>Today
          </button>
          <button data-view="week">
            <span aria-hidden="true">▦</span>Week
          </button>
          <button data-view="morning">
            <span aria-hidden="true">☀</span>Morning
          </button>
          <button data-view="workout">
            <span aria-hidden="true">↗</span>Workout
          </button>
          <button data-view="settings">
            <span aria-hidden="true">⚙</span>Settings
          </button>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span
          ><span id="sync-status">Saved on this device</span
          ><small>CHICAGO · CAMPUS EDITION<br />APP 2.0.2</small>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span id="view-label">YOUR DAY, CONSIDERED</span>
          <div>
            <button
              class="quiet"
              data-action="refresh"
              aria-label="Refresh calendar and sync"
            >
              Refresh</button
            ><button class="primary" data-action="add">+ Add commitment</button>
          </div>
        </header>
        <div id="update-banner" class="banner" hidden>
          <span>A new app version is ready.</span
          ><button data-action="update">Load update</button>
        </div>
        <main id="main" tabindex="-1">
          <section id="page-today" data-page="today">
            <p class="loading">Putting your day together…</p>
          </section>
          <section id="page-week" data-page="week" hidden></section>
          <section id="page-morning" data-page="morning" hidden></section>
          <section id="page-workout" data-page="workout" hidden>
            <div class="page-heading">
              <div>
                <p class="eyebrow">YOUR TRAINING, IN ONE PLACE</p>
                <h1>Keep the program.</h1>
                <p id="workout-freshness">Connecting to your Oly tracker…</p>
              </div>
              <a
                id="open-workout"
                class="button quiet"
                target="_blank"
                rel="noopener"
                >Open standalone ↗</a
              >
            </div>
            <div id="workout-summary"></div>
            <iframe
              id="workout-frame"
              title="Oly training journal"
              allow="fullscreen"
              referrerpolicy="same-origin"
            ></iframe>
          </section>
          <section id="page-settings" data-page="settings" hidden></section>
        </main>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" hidden></div>
    <datalist id="places"></datalist>
    <noscript
      ><p>
        Day needs JavaScript to calculate your schedule. Your saved data remains
        on this device.
      </p></noscript
    >
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
